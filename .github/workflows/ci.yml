name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # baseline-bot commits are pushed with GITHUB_TOKEN and
    # never trigger CI themselves (no nested runs); dispatch lets any post-
    # baseline-update commit be verified without waiting for the next push

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
        env:
          CI: true
