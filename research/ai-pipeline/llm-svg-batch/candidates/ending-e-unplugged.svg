<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img">
  <!-- LLM 直写 SVG 候选库 · 结局 E「UNPLUGGED」：拔掉插头。
       大留白的暗幕 + 居中偏右的插头剪影 + 断缆 + 最后一点将熄余烬。子色板：近黑 + 幽影档 + 单点余烬。 -->
  <rect width="320" height="200" fill="#0d0c09"/>
  <!-- 微弱的地平暗示（极暗切线） -->
  <line x1="0" y1="168" x2="320" y2="168" stroke="#17150f" stroke-width="2"/>
  <line x1="0" y1="176" x2="320" y2="176" stroke="#17150f" stroke-width="1.2"/>
  <!-- 插头剪影（本体 + 双插脚 + 棱线，右倾静卧） -->
  <g transform="rotate(8 190 100)">
    <!-- 缆线（从左侧蜿蜒而来，末端断口散股） -->
    <path d="M28 118 q34 -10 62 2 q26 10 52 -4" stroke="#38342a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M28 118 q10 -3 20 -2" stroke="#55503f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M28 118 q8 4 18 4" stroke="#55503f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M142 116 l6 -4 M144 118 l7 2" stroke="#55503f" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 本体 -->
    <rect x="150" y="82" width="52" height="38" rx="10" fill="#38342a"/>
    <rect x="150" y="82" width="52" height="6" rx="3" fill="#55503f"/>
    <line x1="158" y1="116" x2="194" y2="116" stroke="#262420" stroke-width="2"/>
    <!-- 插脚（朝上，脱离插座的方向） -->
    <rect x="164" y="62" width="7" height="22" rx="2" fill="#55503f"/>
    <rect x="182" y="62" width="7" height="22" rx="2" fill="#55503f"/>
    <!-- 颈口（缆端与本体相接） -->
    <path d="M146 96 q6 -4 8 0 v10 q-4 4 -8 0 z" fill="#262420"/>
  </g>
  <!-- 上方空置的插座暗示（断开的两个小孔，极暗，右上远处） -->
  <circle cx="252" cy="48" r="3" fill="#17150f" stroke="#262420" stroke-width="1.5"/>
  <circle cx="266" cy="48" r="3" fill="#17150f" stroke="#262420" stroke-width="1.5"/>
  <!-- 最后一点余烬（全图唯一彩色：将熄） -->
  <circle cx="196" cy="150" r="2.2" fill="#b44622"/>
  <circle cx="196" cy="150" r="4.5" fill="#b44622" opacity="0.25"/>
</svg>
