  <g class="embers">
    <circle class="mw-pulse" cx="180" cy="110" r="2.5" fill="#7c2a20"/>
    <circle class="mw-pulse" cx="248" cy="112" r="2" fill="#b44622"/>
    <circle class="mw-pulse" cx="300" cy="110" r="2.5" fill="#7c2a20"/>
  </g>
  <!-- 前沿炉唇 -->
  <path fill="none" stroke="#38342a" stroke-width="3" d="M0 116h480"/>
