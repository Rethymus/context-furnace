<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <rect x="1" y="1" width="94" height="94" rx="8" fill="#e4decb"/>
  <rect x="6" y="6" width="84" height="84" rx="5" fill="none" stroke="#26231c" stroke-width="2"/>
  <!-- 坐标轴：投诉率（纵）× 时间（横） -->
  <path fill="none" stroke="#26231c" stroke-width="2.5" stroke-linecap="round" d="M20 20v56h58"/>
  <!-- 曲线：前两天爬峰，随后迅速回落趋平 -->
  <path fill="none" stroke="#26231c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M20 64q6-2 10-24t10-16 10 12 10 20 12 10"/>
  <!-- 峰值点：更新后前两天 -->
  <circle class="mw-pulse" cx="40" cy="24" r="4.5" fill="#b44622"/>
  <path fill="none" stroke="#b44622" stroke-width="1.5" stroke-dasharray="3 3" d="M40 28v20"/>
  <!-- 时间刻：日 1-2-3-5-7 -->
  <path fill="none" stroke="#b6ab94" stroke-width="1.5" d="M30 76v4M40 76v4M50 76v4M62 76v4M74 76v4"/>
  <circle cx="30" cy="82" r="1.5" fill="#26231c"/>
  <circle cx="40" cy="82" r="1.5" fill="#26231c"/>
  <circle cx="50" cy="82" r="1.5" fill="#26231c"/>
  <!-- 回落后的低位基线强调 -->
  <path fill="none" stroke="#26231c" stroke-width="1.5" stroke-linecap="round" d="M62 62h14"/>
</svg>
