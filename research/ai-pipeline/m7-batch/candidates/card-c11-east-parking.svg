<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <rect x="1" y="1" width="94" height="94" rx="8" fill="#e4decb"/>
  <rect x="6" y="6" width="84" height="84" rx="5" fill="none" stroke="#26231c" stroke-width="2"/>
  <!-- 分区图：左大区（车位多）与右东区（车位少），中缝道路 -->
