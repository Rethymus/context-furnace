  <rect class="mw-flicker" x="56" y="30" width="9" height="7" rx="2" fill="#b44622"/>
  <path fill="none" stroke="#b44622" stroke-width="1.5" d="M58 37l-1 3 3-3"/>
  <rect class="mw-flicker" x="70" y="30" width="9" height="7" rx="2" fill="#b44622"/>
